<!DOCTYPE html>
<html lang="en">
<head> 
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>html,body{margin:0;padding:0;overflow:hidden;background-color:#000;width:100%;height:100vh;}
canvas{display:block;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;background:rgba(0,0,0,0.8);z-index:20;font-family:sans-serif;color:white;text-align:center;}
#score-board{position:absolute;top:20px;left:20px;color:white;font-size:24px;font-family:sans-serif;font-weight:bold;z-index:10;display:none;}
.hidden{display:none !important;}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<title>crate</title></head><body>
<div id="score-board">Score: <span id="score">0</span></div>
<div id="ui"><h1 id="title">crate 3d</h1><p id="sub">arrow keys to move, space to jump</p>
<button id="btn" onclick="startGame()">play</button></div><script>
const scene=new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog=new THREE.FogExp2(0x000000,0.05);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const camera=new THREE.PerspectiveCamera(45,window.innerWidth/window.innerHeight,0.1,1000);camera.position.set(2,8,5);camera.lookAt(0,0,0);
const ptG=new THREE.BoxGeometry(3,3,3);const plG=new THREE.BoxGeometry(0.4,0.4,0.4);
const ptM=[
new THREE.MeshStandardMaterial({color:0x0307fc,transparent:true,opacity:0.1,depthWrite:false}),
new THREE.MeshBasicMaterial({visible:false}),
new THREE.MeshBasicMaterial({visible:false}),
new THREE.MeshBasicMaterial({visible:false}),
new THREE.MeshBasicMaterial({visible:false}),
new THREE.MeshBasicMaterial({visible:false}),
new THREE.MeshBasicMaterial({visible:false})];
const plM=new THREE.MeshStandardMaterial({color:0xbb0000});
const pt=new THREE.Mesh(ptG,ptM);
const pl=new THREE.Mesh(plG,plM);
pt.renderOrder=0;pt.receiveShadow=true;pl.castShadow=true;pl.receiveShadow=true;
scene.add(pt);scene.add(pl);
pl.position.set(0,0,0);
const lineMaterial=new THREE.LineBasicMaterial({color:0xffffff});const plE=new THREE.EdgesGeometry(plG);const plW=new THREE.LineSegments(plE,lineMaterial);pl.add(plW);
const ambientLight=new THREE.AmbientLight(0xffffff,0.4);
scene.add(ambientLight);
const directionalLight=new THREE.DirectionalLight(0xffffff,1.5);
directionalLight.position.set(0,10,0);
directionalLight.castShadow=true;
directionalLight.shadow.mapSize.width=1024;
directionalLight.shadow.mapSize.height=1024;
directionalLight.shadow.camera.left=-5;
directionalLight.shadow.camera.right=5;
directionalLight.shadow.camera.top=5;
directionalLight.shadow.camera.bottom=-5;
scene.add(directionalLight);
const shadowPlaneG=new THREE.PlaneGeometry(20,20);
const shadowPlaneM=new THREE.ShadowMaterial({opacity:0.4});
const shadowPlane=new THREE.Mesh(shadowPlaneG,shadowPlaneM);
shadowPlane.rotation.x=-Math.PI/2+0.12;
shadowPlane.position.y=-1.5;
shadowPlane.receiveShadow=true;
scene.add(shadowPlane);
const grid=new THREE.GridHelper(3,4,0xffffff,0xffffff);
grid.position.y=-1.499;
pt.add(grid);
const crateG=new THREE.BoxGeometry(.75,.75,.75);
const crateM=new THREE.MeshStandardMaterial({color:0x8b4513});
const crateE=new THREE.EdgesGeometry(crateG);
const crates=[];
const indG=new THREE.BoxGeometry(0.75,0.75,0.75);
const indM=new THREE.MeshStandardMaterial({color:0xffff00,transparent:true,opacity:0.3,depthWrite:false});
const indE=new THREE.EdgesGeometry(indG);
const indEM=new THREE.LineBasicMaterial({color:0xffff00,transparent:true,opacity:0.8});
const crateGroundY=-1.125;
const crateGravity=-9.8;
const gridCounts=new Array(16).fill(0);
let state='start';
let points=0;
let spawnLimit=3;
function spawnCrate(){
const minC=Math.min(...gridCounts);
const validCells=[];
for(let i=0;i<16;i++){if(gridCounts[i]<minC+2){validCells.push(i);}}
const cell=validCells[Math.floor(Math.random()*validCells.length)];
const col=cell%4;
const row=Math.floor(cell/4);
const crate=new THREE.Mesh(crateG,crateM);
crate.renderOrder=1;
crate.castShadow=true;
crate.receiveShadow=true;
crate.position.x=-1.125+col*0.75;
crate.position.z=-1.125+row*0.75;
crate.position.y=Math.max(6,pl.position.y+6);
crate.userData.vY=0;
crate.userData.targetY=crateGroundY+(gridCounts[cell]*0.75);
const indicator=new THREE.Mesh(indG,indM.clone());
const indicatorEdge=new THREE.LineSegments(indE,indEM.clone());
indicator.add(indicatorEdge);
indicator.renderOrder=2;
indicator.position.set(crate.position.x,crate.userData.targetY,crate.position.z);
scene.add(indicator);
crate.userData.indicator=indicator;
gridCounts[cell]++;
const crateW=new THREE.LineSegments(crateE,lineMaterial);
crate.add(crateW);
scene.add(crate);
crates.push(crate);}
function startGame(){
for(const crate of crates){
scene.remove(crate);
if(crate.userData.indicator){
scene.remove(crate.userData.indicator);
crate.userData.indicator.material.dispose();
crate.userData.indicator.children[0].material.dispose();}}
crates.length=0;
gridCounts.fill(0);
pl.position.set(0,0,0);
points=0;yVel=0;pVelX=0;pVelZ=0;crateT=0;
document.getElementById('score').innerText='0';
document.getElementById('ui').classList.add('hidden');
document.getElementById('score-board').style.display='block';
state='playing';}
function death(){state='dead';
document.getElementById('title').innerText="you dead";
document.getElementById('sub').innerText="final score: "+Math.floor(points);
document.getElementById('btn').innerText="play again";
document.getElementById('ui').classList.remove('hidden');
document.getElementById('score-board').style.display='none';}
window.addEventListener('resize',()=>{
camera.aspect=window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));});
let yVel=0;
let pVelX=0;
let pVelZ=0;
const gravity=-9.8;
const groundY=-1.3;
const keys={};
let grounded=false;
let camLookY=0;

window.addEventListener("keydown",(event)=>{
keys[event.key]=true;
if(event.code==="Space"&&grounded&&state==='playing'){
yVel=5.8;grounded=false;}});
window.addEventListener("keyup",(event)=>{
keys[event.key]=false;});
let crateT=0;
let lastT=performance.now();
function animate(curT){
requestAnimationFrame(animate);
const deltaTime=Math.min((curT-lastT)/1000,0.05);
lastT=curT;
if(state==='playing'){
points+=deltaTime*10;
document.getElementById('score').innerText=Math.floor(points);
spawnLimit=Math.max(0.2,3*Math.pow(0.97,points/20));
let cGround=groundY;
for(const crate of crates){
const dx=Math.abs(pl.position.x-crate.position.x);
const dz=Math.abs(pl.position.z-crate.position.z);
if(dx<0.575&&dz<0.575){
const crateTop=crate.position.y+0.375;
if(pl.position.y-0.2>=crateTop-0.1){
if(crateTop+0.2>cGround){
cGround=crateTop+0.2;}}}}
yVel+=gravity*deltaTime;
pl.position.y+=yVel*deltaTime;
grounded=false;
if(pl.position.y<=cGround){
pl.position.y=cGround;
yVel=0;
grounded=true;}
let tX=0;let tZ=0;
if(keys["ArrowLeft"])tX-=2.5;if(keys["ArrowRight"])tX+=2.5;if(keys["ArrowUp"])tZ-=2.5;if(keys["ArrowDown"])tZ+=2.5;
pVelX+=(tX-pVelX)*14*deltaTime;pVelZ+=(tZ-pVelZ)*14*deltaTime;
let nextX=pl.position.x+pVelX*deltaTime;let nextZ=pl.position.z+pVelZ*deltaTime;let colX=false;let colZ=false;
for(const crate of crates){
if(Math.abs(nextX-crate.position.x)<0.575&&Math.abs(pl.position.z-crate.position.z)<0.575){
if(pl.position.y-0.2<crate.position.y+0.375&&pl.position.y+0.2>crate.position.y-0.375){
colX=true;}}
if(Math.abs(pl.position.x-crate.position.x)<0.575&&Math.abs(nextZ-crate.position.z)<0.575){
if(pl.position.y-0.2<crate.position.y+0.375&&pl.position.y+0.2>crate.position.y-0.375){
colZ=true;}}}
if(!colX)pl.position.x=nextX;
if(!colZ)pl.position.z=nextZ;
pl.position.x=Math.max(-1.3,Math.min(1.3,pl.position.x));
pl.position.z=Math.max(-1.3,Math.min(1.3,pl.position.z));
crateT+=deltaTime;
if(crateT>=spawnLimit){
crateT-=spawnLimit;
spawnCrate();}
for(const crate of crates){
if(crate.position.y>crate.userData.targetY){
crate.userData.vY+=crateGravity*deltaTime;
crate.position.y+=crate.userData.vY*deltaTime;
if(crate.userData.indicator){
let dist=crate.position.y-crate.userData.targetY;
let op=Math.max(0,Math.min(1,dist/4));
crate.userData.indicator.material.opacity=op*0.3;
crate.userData.indicator.children[0].material.opacity=op*0.8;}
if(crate.position.y<=crate.userData.targetY){
crate.position.y=crate.userData.targetY;
crate.userData.vY=0;
if(crate.userData.indicator){
scene.remove(crate.userData.indicator);
crate.userData.indicator.material.dispose();
crate.userData.indicator.children[0].material.dispose();
crate.userData.indicator=null;}}}}
for(const crate of crates){
if(crate.userData.vY<0){
const dx=Math.abs(pl.position.x-crate.position.x);
const dz=Math.abs(pl.position.z-crate.position.z);
if(dx<0.425&&dz<0.425){
const cb=crate.position.y-0.375;
const ct=crate.position.y+0.375;
const pt=pl.position.y+0.2;
const pb=pl.position.y-0.2;if(cb<=pt&&ct>=pb){death();}}}}}
const targetCamY=Math.max(8,pl.position.y+8);camera.position.y+=(targetCamY-camera.position.y)*0.05;
const targetLookY=Math.max(0,pl.position.y);camLookY+=(targetLookY-camLookY)*0.05;camera.lookAt(0,camLookY,0);renderer.render(scene,camera);}animate(performance.now());
</script>
</body>
</html>
