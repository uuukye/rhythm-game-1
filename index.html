function fixLaneOverlaps(chartData){
chartData.sort((a,b)=>a.b-b.b);
const holdEnds=[-Infinity,-Infinity,-Infinity];
let currentBeat=null;
let usedAtBeat=new Set();
for(const note of chartData){
if(currentBeat===null||Math.abs(note.b-currentBeat)>0.0001){
currentBeat=note.b;
usedAtBeat=new Set();
}
const group=[0,1,2];
const blocked=lane=>holdEnds[lane]>=note.b-0.0001||usedAtBeat.has(lane);
if(blocked(note.l)){
const target=group.find(lane=>!blocked(lane));
if(target!==undefined)note.l=target;
}
usedAtBeat.add(note.l);
if(note.h>0)holdEnds[note.l]=Math.max(holdEnds[note.l],note.b+note.h);
}
chartData.sort((a,b)=>a.b-b.b);
}

function prepareCharts(duration){
chart1=chart1Base.map(note=>({b:note.b,l:note.l,h:note.h}));
chart2=chart2Base.map(note=>({b:note.b,l:note.l,h:note.h}));
chart3=chart3Base.map(note=>({b:note.b,l:note.l,h:note.h}));
for(const chartData of [chart1,chart2,chart3]){
fixLaneOverlaps(chartData);
for(const note of chartData)note.b+=0.25;
}
const endBeat=duration*1000/beatLength-0.5;
for(const chartData of [chart1,chart2,chart3]){
for(let i=chartData.length-1;i>=0;i--){
const note=chartData[i];
if(note.b>endBeat)chartData.splice(i,1);
else if(note.b+note.h>endBeat)note.h=Math.max(0,endBeat-note.b);
}
}
}

function recordAccuracy(note,grade){
if(judgedNotes.has(note))return;
judgedNotes.add(note);
accuracyPossible+=100;
accuracyPoints+=grade==="GREAT"?100:grade==="GOOD"?75:grade==="OK"?50:0;
accuracyDisplay=(accuracyPossible?100*accuracyPoints/accuracyPossible:100).toFixed(2)+"%";
}

function judgeGrade(diff){
if(diff<=55)return "GREAT";
if(diff<=90)return "GOOD";
if(diff<=125)return "OK";
return "MISS";
}

function judgeReleaseGrade(diff){
if(diff<=holdReleaseWindow*0.35)return "GREAT";
if(diff<=holdReleaseWindow*0.6)return "GOOD";
return "OK";
}

function finishHold(note,releaseDiff){
if(note.hit||note.broken)return;
note.hit=true;
note.holding=false;
const startGrade=judgeGrade(note.startDiff||0);
const releaseGrade=judgeReleaseGrade(releaseDiff||0);
const rank={MISS:0,OK:1,GOOD:2,GREAT:3};
feedback=rank[startGrade]<rank[releaseGrade]?startGrade:releaseGrade;
recordAccuracy(note,feedback);
feedbackLane=note.l;
feedbackUntil=millis()+700;
}

function breakHold(note,lane){
if(note.hit||note.broken)return;
note.holding=false;
note.broken=true;
note.brokenAt=getElapsedTime();
note.fading=true;
note.fadingAt=note.brokenAt;
recordAccuracy(note,"MISS");
feedback="MISS";
feedbackLane=lane;
feedbackUntil=millis()+700;
}

function drawNotes(top){
const elapsed=getElapsedTime();
const verticalHitY=top+410;
const verticalSpawnY=top-20;
const bottom=top+500;
const noteColors=[[255,70,140],[60,255,130],[255,180,45]];
for(let i=0;i<chart.length;i++){
const note=chart[i];
const noteTime=getNoteTime(note);
const originalHoldEndTime=getNoteTime({b:note.b+note.h});
const holdEndTime=note.started?note.holdEndTime:originalHoldEndTime;
if(note.holding){
if(note.releasePending){
if(laneA[note.l]){
note.releasePending=false;
delete note.releaseAt;
}else if(elapsed-note.releaseAt>=holdReleaseWindow){
const releaseDiff=Math.abs(elapsed-note.holdEndTime);
if(releaseDiff<=holdReleaseWindow)finishHold(note,releaseDiff);
else breakHold(note,note.l);
}
}
if(note.holding&&!note.releasePending&&elapsed>note.holdEndTime+holdReleaseWindow)breakHold(note,note.l);
if(note.holding&&!note.releasePending&&!note.fading){
while(note.nextHoldTickTime<note.holdEndTime&&note.nextHoldTickTime<=Math.min(elapsed,note.holdEndTime)){
if(millis()>=feedbackUntil){
feedback="GREAT";
feedbackLane=note.l;
feedbackUntil=millis()+holdTickLength*0.9;
}
note.nextHoldTickTime+=holdTickLength;
}
}
}
if(!note.hit&&!note.started&&!note.missed&&elapsed>noteTime+150){
note.missed=true;
recordAccuracy(note,"MISS");
feedback="MISS";
feedbackLane=note.l;
feedbackUntil=millis()+700;
}
if(gameStarted&&!note.hit){
const spawnTime=noteTime-noteTravelTime;
const progress=(elapsed-spawnTime)/noteTravelTime;
const spawnPos=verticalSpawnY;
const hitPos=verticalHitY;
const pixelsPerMs=(hitPos-spawnPos)/noteTravelTime;
const isVisible=(elapsed>=spawnTime&&elapsed<=noteTime+150)||note.started||note.missed;
if(isVisible){
let notePos;
if(note.started&&!note.broken)notePos=hitPos;
else if(note.started&&note.broken)notePos=hitPos+Math.max(0,elapsed-(note.brokenAt??noteTime))*pixelsPerMs;
else notePos=spawnPos+(hitPos-spawnPos)*Math.max(0,progress);
const noteAlpha=note.fading?Math.max(0,1-(elapsed-note.fadingAt)/holdFadeLength):1;
const noteColor=note.fading?[255,35,35]:noteColors[note.l];
fill(noteColor[0],noteColor[1],noteColor[2],180*noteAlpha);
let tailPos=notePos;
let holdLength=0;
if(note.h>0){
if(note.started&&!note.broken)holdLength=Math.max(0,holdEndTime-elapsed)*pixelsPerMs;
else if(note.started&&note.broken)holdLength=Math.max(0,holdEndTime-(note.brokenAt??elapsed))*pixelsPerMs;
else holdLength=note.h*beatLength*pixelsPerMs;
tailPos=notePos-holdLength;
{
const laneX=verticalLaneStart+note.l*verticalLaneWidth;
rect(laneX,tailPos,verticalLaneWidth,holdLength);
if(note.fading)stroke(255,35,35,255*noteAlpha);
else stroke(255,255*noteAlpha);
strokeWeight(2);
rect(laneX,tailPos-7,verticalLaneWidth,14);
noStroke();
}
}
fill(noteColor[0],noteColor[1],noteColor[2],255*noteAlpha);
{
const laneX=verticalLaneStart+note.l*verticalLaneWidth;
if(note.fading)stroke(255,35,35,255*noteAlpha);
else stroke(255,255*noteAlpha);
strokeWeight(2);
rect(laneX,notePos-9,verticalLaneWidth,18);
noStroke();
if((note.missed||(note.started&&note.broken))&&(note.h>0?tailPos>bottom+30:notePos>bottom+30))note.hit=true;
}
}
}
}
push();
textAlign(LEFT,TOP);

fill(255);
textSize(14);
text("ACCURACY",18,14);
textSize(24);
fill(255,230,120);
text(accuracyDisplay,18,32);

if(millis()<feedbackUntil&&feedbackLane>=0){

function laneFromKeyCode(code){
if(code===LEFT_ARROW)return 0;
if(code===DOWN_ARROW)return 1;
if(code===RIGHT_ARROW)return 2;
return -1;
}

function laneKeyCodes(){
return [LEFT_ARROW,DOWN_ARROW,RIGHT_ARROW];
}

function releaseLane(lane){
laneA[lane]=false;
const elapsed=getElapsedTime();
for(const note of chart){
if(!note.holding||note.l!==lane||note.releasePending)continue;
const diff=Math.abs(elapsed-note.holdEndTime);
if(diff<=holdReleaseWindow)finishHold(note,diff);
else{
note.releasePending=true;
note.releaseAt=elapsed;
}
}
}

function releaseAllKeys(){
for(let lane=0;lane<3;lane++)releaseLane(lane);
}

function syncLaneKeys(){
const keyCodes=laneKeyCodes();
for(let lane=0;lane<3;lane++)if(laneA[lane]&&!keyIsDown(keyCodes[lane]))releaseLane(lane);
}

function keyPressed(event){
if(screen==="menu"){
if(keyCode===LEFT_ARROW||keyCode===RIGHT_ARROW){
selectedLevel=(selectedLevel+(keyCode===RIGHT_ARROW?1:2))%3;
loadSelectedSong();
}
return false;
}
if(screen==="end"){
return false;
}
if(screen!=="game")return false;
const lane=laneFromKeyCode(keyCode);
if(lane<0)return false;
if(event&&event.repeat)return false;
if(laneA[lane])return false;
laneA[lane]=true;
laneFlashStart[lane]=millis();
if(!gameStarted)return false;
const elapsed=getElapsedTime();
const pendingHold=chart.find(note=>note.holding&&note.releasePending&&note.l===lane);
if(pendingHold){
if(elapsed-pendingHold.releaseAt<=holdReleaseWindow){
pendingHold.releasePending=false;
delete pendingHold.releaseAt;
}else{
breakHold(pendingHold,lane);
}
return false;
}
let best=-1;
let bestDiff=151;
for(let i=0;i<chart.length;i++){
const note=chart[i];
const diff=Math.abs(elapsed-getNoteTime(note));
if(!note.hit&&!note.started&&!note.missed&&note.l===lane&&diff<bestDiff){
best=i;
bestDiff=diff;
}
}
if(best>=0&&bestDiff<=150){
const note=chart[best];
if(note.h>0){
const holdEndTime=getNoteTime({b:note.b+note.h});
if(elapsed>=holdEndTime){
note.hit=true;
recordAccuracy(note,"MISS");
feedback="MISS";
feedbackLane=lane;
feedbackUntil=millis()+700;
}else{
note.started=true;
note.holding=true;
note.startDiff=bestDiff;
note.holdEndTime=holdEndTime;
note.nextHoldTickTime=Math.max(elapsed,getNoteTime(note))+holdTickLength;
feedback=judgeGrade(bestDiff);
feedbackLane=lane;
feedbackUntil=millis()+700;
}
}else{
note.hit=true;
feedback=judgeGrade(bestDiff);
recordAccuracy(note,feedback);
feedbackLane=lane;
feedbackUntil=millis()+700;
}
}
return false;
}

function keyReleased(){
const lane=laneFromKeyCode(keyCode);
if(lane>=0)releaseLane(lane);
return false;
}

</script>
